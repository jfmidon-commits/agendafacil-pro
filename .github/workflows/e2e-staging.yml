name: 🧪 Staging E2E Public Booking

on:
  workflow_dispatch:
    inputs:
      run_signup_ui:
        description: "Executar também o signup real pela UI (pode consumir limite de e-mail do Supabase)"
        required: false
        default: false
        type: boolean
  workflow_run:
    workflows: ["🚀 Deploy Staging Fixed"]
    types: [completed]

jobs:
  e2e:
    name: E2E Staging — API + Professional UI + Billing
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: 📥 Checkout deployed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: ⚡ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 📦 Install dependencies
        run: cd web && npm install --no-audit --no-fund

      - name: 🧪 Run API/domain E2E tests
        run: cd web && npx vitest run lib/domain/*.e2e.test.ts
        env:
          RUN_STAGING_E2E: '1'
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_APP_URL: https://agendafacil-staging-pearl.vercel.app
          NEXT_PUBLIC_APP_URL_STAGING: https://agendafacil-staging-pearl.vercel.app

      - name: 🎭 Install Playwright Chromium
        run: cd web && npx playwright install --with-deps chromium

      - name: 📱 Run professional UI + Stripe TEST E2E
        run: cd web && npx playwright test e2e/professional-flow.spec.ts e2e/copy-link.spec.ts e2e/dashboard-mobile-audit.spec.ts e2e/billing-flow.spec.ts
        env:
          RUN_STAGING_E2E: '1'
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          NEXT_PUBLIC_APP_URL: https://agendafacil-staging-pearl.vercel.app
          NEXT_PUBLIC_APP_URL_STAGING: https://agendafacil-staging-pearl.vercel.app

      - name: ✉️ Run real signup UI smoke
        if: github.event_name == 'workflow_dispatch' && inputs.run_signup_ui
        run: cd web && npx playwright test e2e/signup-smoke.spec.ts
        env:
          RUN_STAGING_E2E: '1'
          RUN_SIGNUP_UI_E2E: '1'
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_APP_URL: https://agendafacil-staging-pearl.vercel.app
          NEXT_PUBLIC_APP_URL_STAGING: https://agendafacil-staging-pearl.vercel.app

      - name: 📎 Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics-${{ github.run_id }}
          path: |
            web/playwright-report/
            web/test-results/
          if-no-files-found: ignore
          retention-days: 7
