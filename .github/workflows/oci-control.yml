name: OCI Control Bridge

on:
  push:
    branches: [main]
    paths:
      - "ops/oci-request.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oci-control
  cancel-in-progress: false

jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"
      SUPPRESS_LABEL_WARNING: "True"
      OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
      OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
      OCI_REGION: ${{ secrets.OCI_REGION }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate OCI secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in OCI_TENANCY_OCID OCI_USER_OCID OCI_FINGERPRINT OCI_PRIVATE_KEY OCI_REGION; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not configured"
              exit 1
            fi
          done

      - name: Install OCI CLI
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --quiet oci-cli
          oci --version

      - name: Configure OCI authentication
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.oci"
          printf '%s\n' "$OCI_PRIVATE_KEY" > "$HOME/.oci/oci_api_key.pem"
          chmod 600 "$HOME/.oci/oci_api_key.pem"
          cat > "$HOME/.oci/config" <<EOF
          [DEFAULT]
          user=$OCI_USER_OCID
          fingerprint=$OCI_FINGERPRINT
          tenancy=$OCI_TENANCY_OCID
          region=$OCI_REGION
          key_file=$HOME/.oci/oci_api_key.pem
          EOF
          chmod 600 "$HOME/.oci/config"

      - name: Verify OCI authentication
        shell: bash
        run: |
          set -euo pipefail
          oci iam region-subscription list --output table >/dev/null
          echo "OCI authentication OK"

      - name: Execute OCI control request
        shell: bash
        run: |
          set -euo pipefail
          REQUEST="ops/oci-request.json"
          jq empty "$REQUEST"

          REQUEST_ID="$(jq -r '.request_id // "unspecified"' "$REQUEST")"
          OPERATION="$(jq -r '.operation // empty' "$REQUEST")"
          INSTANCE_NAME="$(jq -r '.instance_name // "agendafacil-evolution"' "$REQUEST")"

          case "$OPERATION" in
            inventory|run_command_status|run_instance_command) ;;
            *) echo "::error::Unsupported operation: $OPERATION"; exit 2 ;;
          esac

          echo "Request: $REQUEST_ID"
          echo "Operation: $OPERATION"
          echo "Instance: $INSTANCE_NAME"

          SEARCH_JSON="$(oci search resource structured-search \
            --query-text "query instance resources where displayName = '$INSTANCE_NAME'" \
            --query 'data.items[0]' \
            --raw-output)"

          if [ -z "$SEARCH_JSON" ] || [ "$SEARCH_JSON" = "null" ]; then
            echo "::error::Instance '$INSTANCE_NAME' not found"
            exit 3
          fi

          IID="$(printf '%s' "$SEARCH_JSON" | jq -r '.identifier')"
          INSTANCE_COMPARTMENT="$(printf '%s' "$SEARCH_JSON" | jq -r '."compartment-id"')"

          echo "Instance OCID: $IID"
          echo "Compartment OCID: $INSTANCE_COMPARTMENT"

          if [ "$OPERATION" = "inventory" ]; then
            echo "=== INSTANCE ==="
            oci compute instance get \
              --instance-id "$IID" \
              --query 'data.{name:"display-name",state:"lifecycle-state",shape:shape,created:"time-created"}' \
              --output table

            echo "=== NETWORK ==="
            oci compute instance list-vnics \
              --instance-id "$IID" \
              --query 'data[].{private_ip:"private-ip",public_ip:"public-ip"}' \
              --output table

            echo "=== RUN COMMAND PLUGIN ==="
            oci instance-agent plugin list \
              --compartment-id "$INSTANCE_COMPARTMENT" \
              --instanceagent-id "$IID" \
              --all \
              --query 'data[?name==`Compute Instance Run Command`].{plugin:name,status:status}' \
              --output table
            exit 0
          fi

          if [ "$OPERATION" = "run_command_status" ]; then
            echo "=== RUN COMMAND EXECUTIONS ==="
            oci instance-agent command-execution list \
              --compartment-id "$INSTANCE_COMPARTMENT" \
              --instance-id "$IID" \
              --limit 10 \
              --sort-by TIMECREATED \
              --sort-order DESC \
              --query 'data[].{name:"display-name",status:"lifecycle-state",delivery:"delivery-state",created:"time-created"}' \
              --output table

            echo "=== LATEST COMMAND DETAILS ==="
            LATEST_CMD_ID="$(oci instance-agent command list \
              --compartment-id "$INSTANCE_COMPARTMENT" \
              --limit 1 \
              --sort-by TIMECREATED \
              --sort-order DESC \
              --query 'data[0].id' \
              --raw-output)"

            if [ -n "$LATEST_CMD_ID" ] && [ "$LATEST_CMD_ID" != "None" ] && [ "$LATEST_CMD_ID" != "null" ]; then
              echo "Latest command OCID: $LATEST_CMD_ID"
              oci instance-agent command get \
                --command-id "$LATEST_CMD_ID" \
                --query 'data.{name:"display-name",created:"time-created",timeout:"timeout-in-seconds"}' \
                --output table || true

              echo "=== LATEST EXECUTION FULL DETAILS ==="
              oci instance-agent command-execution get \
                --command-id "$LATEST_CMD_ID" \
                --instance-id "$IID" \
                --output json || true
            else
              echo "No command OCID found"
            fi
            exit 0
          fi

          SCRIPT_B64="$(jq -r '.script_b64 // empty' "$REQUEST")"
          if [ -z "$SCRIPT_B64" ]; then
            echo "::error::run_instance_command requires script_b64"
            exit 4
          fi

          printf '%s' "$SCRIPT_B64" | base64 --decode > /tmp/oci-remote.sh
          chmod 700 /tmp/oci-remote.sh

          CONTENT="$(python3 - <<'PY'
          import json
          from pathlib import Path
          script = Path('/tmp/oci-remote.sh').read_text()
          print(json.dumps({
              'source': {'sourceType': 'TEXT', 'text': script},
              'output': {'outputType': 'TEXT'}
          }))
          PY
          )"

          CMD_ID="$(oci instance-agent command create \
            --compartment-id "$INSTANCE_COMPARTMENT" \
            --content "$CONTENT" \
            --target "{\"instanceId\":\"$IID\"}" \
            --timeout-in-seconds 600 \
            --display-name "github-$REQUEST_ID" \
            --query 'data.id' \
            --raw-output)"

          echo "Submitted Run Command: $CMD_ID"
          sleep 15

          oci instance-agent command-execution list \
            --compartment-id "$INSTANCE_COMPARTMENT" \
            --instance-id "$IID" \
            --limit 10 \
            --sort-by TIMECREATED \
            --sort-order DESC \
            --query 'data[].{name:"display-name",status:"lifecycle-state",delivery:"delivery-state",created:"time-created"}' \
            --output table
