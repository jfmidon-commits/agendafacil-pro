name: OCI Control Bridge

on:
  push:
    branches: [main]
    paths:
      - "ops/oci-request.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oci-control
  cancel-in-progress: false

jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"
      SUPPRESS_LABEL_WARNING: "True"
      OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
      OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
      OCI_REGION: ${{ secrets.OCI_REGION }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate OCI secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in OCI_TENANCY_OCID OCI_USER_OCID OCI_FINGERPRINT OCI_PRIVATE_KEY OCI_REGION; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not configured as a GitHub Actions secret"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Install OCI CLI
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --quiet oci-cli
          oci --version

      - name: Configure OCI API authentication
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.oci"
          printf '%s\n' "$OCI_PRIVATE_KEY" > "$HOME/.oci/oci_api_key.pem"
          chmod 600 "$HOME/.oci/oci_api_key.pem"
          cat > "$HOME/.oci/config" <<EOF
          [DEFAULT]
          user=$OCI_USER_OCID
          fingerprint=$OCI_FINGERPRINT
          tenancy=$OCI_TENANCY_OCID
          region=$OCI_REGION
          key_file=$HOME/.oci/oci_api_key.pem
          EOF
          chmod 600 "$HOME/.oci/config"

      - name: Verify OCI authentication
        shell: bash
        run: |
          set -euo pipefail
          echo "Region: $OCI_REGION"
          oci iam region-subscription list --query 'data[].{"region":"region-name","status":status}' --output table

      - name: Discover compartments and locate instance
        shell: bash
        run: |
          set -euo pipefail
          echo "=== LISTING COMPARTMENTS ==="
          oci iam compartment list --compartment-id "$OCI_TENANCY_OCID" --all --query 'data[].{name:name,id:id,state:"lifecycle-state"}' --output table

          echo ""
          echo "=== SEARCHING FOR INSTANCE ACROSS ALL COMPARTMENTS ==="
          oci search resource structured-search --query-text "query instance resources where displayName = 'agendafacil-evolution'" --query 'data.items[].{name:"display-name",id:identifier,compartment:"compartment-id",state:"lifecycle-state"}' --output table || true

      - name: Execute OCI control request
        shell: bash
        run: |
          set -euo pipefail

          REQUEST="ops/oci-request.json"
          jq empty "$REQUEST"

          REQUEST_ID="$(jq -r '.request_id // "unspecified"' "$REQUEST")"
          OPERATION="$(jq -r '.operation // empty' "$REQUEST")"
          INSTANCE_NAME="$(jq -r '.instance_name // "agendafacil-evolution"' "$REQUEST")"
          COMPARTMENT_ID="$(jq -r '.compartment_id // empty' "$REQUEST")"

          echo "Request: $REQUEST_ID"
          echo "Operation: $OPERATION"
          echo "Instance: $INSTANCE_NAME"

          case "$OPERATION" in
            inventory|run_command_status|run_instance_command) ;;
            *)
              echo "::error::Unsupported operation: $OPERATION"
              exit 2
              ;;
          esac

          # If compartment_id is provided in request, use it; otherwise search all compartments
          if [ -n "$COMPARTMENT_ID" ]; then
            echo "Using provided compartment: $COMPARTMENT_ID"
            SEARCH_COMPARTMENT="$COMPARTMENT_ID"
          else
            echo "Searching in root compartment and all sub-compartments..."
            SEARCH_COMPARTMENT="$OCI_TENANCY_OCID"
          fi

          # Try to find instance - first in specified compartment, then search all
          IID="$(oci compute instance list             --compartment-id "$SEARCH_COMPARTMENT"             --display-name "$INSTANCE_NAME"             --all             --query 'data[?"lifecycle-state"==`RUNNING` || "lifecycle-state"==`PROVISIONING` || "lifecycle-state"==`STARTING`][0].id'             --raw-output 2>/dev/null || true)"

          # If not found, try searching across all compartments using structured search
          if [ -z "$IID" ] || [ "$IID" = "None" ] || [ "$IID" = "null" ]; then
            echo "Not found in primary compartment. Searching all compartments..."
            SEARCH_RESULT="$(oci search resource structured-search               --query-text "query instance resources where displayName = '$INSTANCE_NAME'"               --query 'data.items[0].identifier' --raw-output 2>/dev/null || true)"
            if [ -n "$SEARCH_RESULT" ] && [ "$SEARCH_RESULT" != "null" ]; then
              IID="$SEARCH_RESULT"
              echo "Found via search: $IID"
            fi
          fi

          if [ -z "$IID" ] || [ "$IID" = "None" ] || [ "$IID" = "null" ]; then
            echo "::error::Instance '$INSTANCE_NAME' was not found in any compartment"
            exit 3
          fi

          echo "Instance OCID: $IID"

          if [ "$OPERATION" = "inventory" ]; then
            echo "=== INSTANCE ==="
            oci compute instance get               --instance-id "$IID"               --query 'data.{name:"display-name",state:"lifecycle-state",shape:shape,created:"time-created",ad:"availability-domain"}'               --output table

            echo "=== NETWORK ==="
            oci compute instance list-vnics               --instance-id "$IID"               --query 'data[].{name:"display-name",private_ip:"private-ip",public_ip:"public-ip",subnet_id:"subnet-id"}'               --output table

            echo "=== INSTANCE AGENT PLUGINS ==="
            oci instance-agent plugin list               --compartment-id "$OCI_TENANCY_OCID"               --instanceagent-id "$IID"               --all               --query 'data[].{plugin:name,status:status}'               --output table || echo "(Instance Agent plugin list may require instance-level permissions)"

            echo "=== RUN COMMAND EXECUTIONS ==="
            oci instance-agent command-execution list               --compartment-id "$OCI_TENANCY_OCID"               --instance-id "$IID"               --all               --query 'data[].{name:"display-name",status:"lifecycle-state",delivery:"delivery-state",command_id:"command-id"}'               --output table || echo "(No run command executions found or permission issue)"
            exit 0
          fi

          if [ "$OPERATION" = "run_command_status" ]; then
            echo "=== RUN COMMAND PLUGIN ==="
            oci instance-agent plugin list               --compartment-id "$OCI_TENANCY_OCID"               --instanceagent-id "$IID"               --all               --query 'data[?name==`Compute Instance Run Command`].{plugin:name,status:status}'               --output table || true

            echo "=== RUN COMMAND EXECUTIONS ==="
            oci instance-agent command-execution list               --compartment-id "$OCI_TENANCY_OCID"               --instance-id "$IID"               --all               --query 'data[].{name:"display-name",status:"lifecycle-state",delivery:"delivery-state",command_id:"command-id",created:"time-created"}'               --output table || true
            exit 0
          fi

          SCRIPT_B64="$(jq -r '.script_b64 // empty' "$REQUEST")"
          if [ -z "$SCRIPT_B64" ]; then
            echo "::error::run_instance_command requires script_b64"
            exit 4
          fi

          printf '%s' "$SCRIPT_B64" | base64 --decode > /tmp/oci-remote.sh
          chmod 700 /tmp/oci-remote.sh
          echo "Remote script bytes: $(wc -c < /tmp/oci-remote.sh)"

          CONTENT="$(python - <<'PY'
          import json
          from pathlib import Path
          script = Path('/tmp/oci-remote.sh').read_text()
          print(json.dumps({
              'source': {'sourceType': 'TEXT', 'text': script},
              'output': {'outputType': 'TEXT'},
          }))
          PY
          )"

          CMD_ID="$(oci instance-agent command create             --compartment-id "$OCI_TENANCY_OCID"             --content "$CONTENT"             --target "{\"instanceId\":\"$IID\"}"             --timeout-in-seconds 600             --display-name "github-$REQUEST_ID"             --query 'data.id'             --raw-output)"

          echo "Submitted Run Command: $CMD_ID"
          sleep 10

          echo "=== CURRENT RUN COMMAND EXECUTIONS ==="
          oci instance-agent command-execution list             --compartment-id "$OCI_TENANCY_OCID"             --instance-id "$IID"             --all             --query 'data[].{name:"display-name",status:"lifecycle-state",delivery:"delivery-state",command_id:"command-id"}'             --output table || true
