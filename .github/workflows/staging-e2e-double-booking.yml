name: 🧪 Staging E2E Double Booking

on:
  push:
    branches:
      - test/staging-e2e
    paths:
      - '.github/workflows/staging-e2e-double-booking.yml'

jobs:
  double-booking:
    runs-on: ubuntu-latest
    env:
      APP_URL: https://agendafacil-staging-pearl.vercel.app
      SLUG: e2e-barbearia-ae7c0994
      SERVICE_ID: dc6031a8-6980-43a5-a944-8e294d57a312
      TEST_DATE: '2026-08-30'
    steps:
      - name: Query real availability from staging
        id: availability
        shell: bash
        run: |
          set -euo pipefail
          url="$APP_URL/api/availability?slug=$SLUG&serviceId=$SERVICE_ID&date=$TEST_DATE"
          echo "GET $url"
          body=$(curl --fail-with-body -sS "$url")
          echo "$body"
          printf '%s' "$body" > /tmp/availability.json
          slot=$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/availability.json','utf8'));if(!Array.isArray(x.slots)||!x.slots.length) process.exit(2);process.stdout.write(x.slots[0].starts_at)")
          echo "slot=$slot" >> "$GITHUB_OUTPUT"
          echo "Selected slot: $slot"

      - name: Fire two simultaneous bookings for the exact same slot
        id: race
        shell: bash
        env:
          SLOT: ${{ steps.availability.outputs.slot }}
        run: |
          set -euo pipefail
          node - <<'NODE' > /tmp/payload1.json
          const slot = process.env.SLOT;
          process.stdout.write(JSON.stringify({
            slug: process.env.SLUG,
            serviceId: process.env.SERVICE_ID,
            startsAt: slot,
            clientName: 'Cliente E2E A',
            clientPhone: '51911111111',
            clientEmail: 'cliente-a@example.com',
            notes: 'double-booking-e2e'
          }));
          NODE
          node - <<'NODE' > /tmp/payload2.json
          const slot = process.env.SLOT;
          process.stdout.write(JSON.stringify({
            slug: process.env.SLUG,
            serviceId: process.env.SERVICE_ID,
            startsAt: slot,
            clientName: 'Cliente E2E B',
            clientPhone: '51922222222',
            clientEmail: 'cliente-b@example.com',
            notes: 'double-booking-e2e'
          }));
          NODE

          (
            curl -sS -o /tmp/resp1.json -w '%{http_code}' \
              -H 'Content-Type: application/json' \
              --data-binary @/tmp/payload1.json \
              "$APP_URL/api/book" > /tmp/code1
          ) &
          p1=$!
          (
            curl -sS -o /tmp/resp2.json -w '%{http_code}' \
              -H 'Content-Type: application/json' \
              --data-binary @/tmp/payload2.json \
              "$APP_URL/api/book" > /tmp/code2
          ) &
          p2=$!
          wait "$p1"
          wait "$p2"

          code1=$(cat /tmp/code1)
          code2=$(cat /tmp/code2)
          echo "Response A: HTTP $code1"
          cat /tmp/resp1.json; echo
          echo "Response B: HTTP $code2"
          cat /tmp/resp2.json; echo

          sorted=$(printf '%s\n%s\n' "$code1" "$code2" | sort -n | tr '\n' ' ' | sed 's/ $//')
          echo "Sorted statuses: $sorted"
          if [ "$sorted" != '201 409' ]; then
            echo "Expected exactly one 201 and one 409, got: $code1 + $code2" >&2
            exit 1
          fi
          echo "code1=$code1" >> "$GITHUB_OUTPUT"
          echo "code2=$code2" >> "$GITHUB_OUTPUT"

      - name: Verify the booked slot disappeared from availability
        shell: bash
        env:
          SLOT: ${{ steps.availability.outputs.slot }}
        run: |
          set -euo pipefail
          url="$APP_URL/api/availability?slug=$SLUG&serviceId=$SERVICE_ID&date=$TEST_DATE"
          body=$(curl --fail-with-body -sS "$url")
          echo "$body"
          printf '%s' "$body" > /tmp/availability-after.json
          node - <<'NODE'
          const fs = require('fs');
          const slot = process.env.SLOT;
          const x = JSON.parse(fs.readFileSync('/tmp/availability-after.json','utf8'));
          if ((x.slots || []).some(s => s.starts_at === slot)) {
            console.error('Booked slot is still available:', slot);
            process.exit(1);
          }
          console.log('Booked slot correctly removed from availability:', slot);
          NODE
