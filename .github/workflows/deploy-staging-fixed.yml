name: 🚀 Deploy Staging Fixed

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-staging-fixed.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ⚡ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 📦 Install dependencies
        run: |
          cd web
          npm install --no-audit --no-fund

      - name: 🧪 Validate app
        run: |
          cd web
          npm run typecheck
          npm test
          npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: https://agendafacil-staging-pearl.vercel.app
          CANCEL_SIGNING_SECRET: ${{ secrets.CANCEL_SIGNING_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

      - name: 🔐 Sync required Vercel runtime env
        working-directory: ./web
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          CRON_SECRET_VALUE: ${{ secrets.CRON_SECRET }}
          APP_URL_VALUE: https://agendafacil-staging-pearl.vercel.app
        run: |
          set -euo pipefail
          node <<'NODE'
          const cronSecret = (process.env.CRON_SECRET_VALUE || '').replace(/[\r\n]/g, '');
          const appUrl = (process.env.APP_URL_VALUE || '').replace(/[\r\n]/g, '');
          const projectId = process.env.VERCEL_PROJECT_ID || '';
          const teamId = process.env.VERCEL_ORG_ID || '';
          const token = process.env.VERCEL_TOKEN || '';

          if (!cronSecret || !appUrl || !projectId || !teamId || !token) {
            console.error('Required Vercel synchronization input is unavailable.');
            process.exit(1);
          }

          const endpoint = new URL(`https://api.vercel.com/v10/projects/${encodeURIComponent(projectId)}/env`);
          endpoint.searchParams.set('upsert', 'true');
          endpoint.searchParams.set('teamId', teamId);

          const response = await fetch(endpoint, {
            method: 'POST',
            headers: {
              Authorization: `Bearer ${token}`,
              'Content-Type': 'application/json',
            },
            body: JSON.stringify([
              {
                key: 'CRON_SECRET',
                value: cronSecret,
                type: 'sensitive',
                target: ['production'],
                comment: 'Synced by AgendaFacil staging deploy',
              },
              {
                key: 'NEXT_PUBLIC_APP_URL',
                value: appUrl,
                type: 'plain',
                target: ['production'],
                comment: 'Canonical AgendaFacil staging URL',
              },
            ]),
          });

          let result = null;
          try {
            result = await response.json();
          } catch {}

          if (!response.ok) {
            console.error(`Vercel environment upsert failed with HTTP ${response.status}.`);
            process.exit(1);
          }

          const failed = Array.isArray(result?.failed) ? result.failed : [];
          if (failed.length) {
            const keys = failed.map((item) => item?.key || 'unknown').join(', ');
            console.error(`Vercel rejected environment variables: ${keys}`);
            process.exit(1);
          }

          console.log('Required Vercel production environment variables were upserted successfully.');
          NODE

      - name: 🚀 Deploy to Vercel
        working-directory: ./web
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@latest deploy --prod --yes --token="${{ secrets.VERCEL_TOKEN }}"
