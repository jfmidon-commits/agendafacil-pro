name: 🚀 Deploy Staging Fixed

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-staging-fixed.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ⚡ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install dependencies
        run: |
          cd web
          npm install --no-audit --no-fund

      - name: 🧪 Validate app
        run: |
          cd web
          npm run typecheck
          npm test
          npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: https://agendafacil-staging-pearl.vercel.app
          CANCEL_SIGNING_SECRET: ${{ secrets.CANCEL_SIGNING_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

      - name: 🚀 Deploy to Vercel
        working-directory: ./web
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@latest deploy --prod --yes --token="${{ secrets.VERCEL_TOKEN }}"
