name: 🚀 Deploy Staging Fixed

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-staging-fixed.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ⚡ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install dependencies
        run: |
          cd web
          npm install --no-audit --no-fund

      - name: 🧪 Validate app
        run: |
          cd web
          npm run typecheck
          npm test
          npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: https://agendafacil-staging-pearl.vercel.app
          CANCEL_SIGNING_SECRET: ${{ secrets.CANCEL_SIGNING_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

      - name: 🔐 Sync required Vercel runtime env
        working-directory: ./web
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          CRON_SECRET_VALUE: ${{ secrets.CRON_SECRET }}
          APP_URL_VALUE: https://agendafacil-staging-pearl.vercel.app
        run: |
          set -euo pipefail

          sync_env() {
            name="$1"
            value="$(printf '%s' "$2" | tr -d '\r\n')"

            if [ -z "$value" ]; then
              echo "::error::Source value for ${name} is unavailable after normalization."
              exit 1
            fi

            if printf '%s' "$value" | npx --yes vercel@latest env update "$name" production --token="$VERCEL_TOKEN" >/tmp/vercel-env.log 2>&1; then
              echo "${name} updated in Vercel production environment."
              return
            fi

            if printf '%s' "$value" | npx --yes vercel@latest env add "$name" production --token="$VERCEL_TOKEN" >/tmp/vercel-env.log 2>&1; then
              echo "${name} added to Vercel production environment."
              return
            fi

            cat /tmp/vercel-env.log
            echo "::error::Could not synchronize ${name} with Vercel."
            exit 1
          }

          sync_env CRON_SECRET "$CRON_SECRET_VALUE"
          sync_env NEXT_PUBLIC_APP_URL "$APP_URL_VALUE"

          npx --yes vercel@latest env pull /tmp/vercel-production.env --environment=production --yes --token="$VERCEL_TOKEN" >/tmp/vercel-env-pull.log 2>&1

          CRON_SECRET_VALUE="$CRON_SECRET_VALUE" node <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('/tmp/vercel-production.env', 'utf8');

          function readEnv(name) {
            const line = text.split(/\r?\n/).find((item) => item.startsWith(`${name}=`));
            if (!line) return null;
            const raw = line.slice(name.length + 1);
            if (raw.startsWith('"')) {
              try { return JSON.parse(raw); } catch { return raw.slice(1, -1); }
            }
            return raw;
          }

          const expected = (process.env.CRON_SECRET_VALUE || '').replace(/[\r\n]/g, '');
          const actual = (readEnv('CRON_SECRET') || '').replace(/[\r\n]/g, '');

          if (!expected || !actual || expected !== actual) {
            console.error('CRON_SECRET production value does not match the normalized GitHub source.');
            process.exit(1);
          }

          console.log('CRON_SECRET production value verified without exposing the secret.');
          NODE

      - name: 🚀 Deploy to Vercel
        working-directory: ./web
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@latest deploy --prod --yes --token="${{ secrets.VERCEL_TOKEN }}"
