name: 🔐 Bootstrap Staging Integrations

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-staging-integrations.yml'

permissions:
  contents: read

jobs:
  bootstrap:
    name: Sync existing integration secrets and bootstrap Stripe TEST + Make
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ⚡ Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: 🔐 Sync available staging integrations
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          STRIPE_SECRET_KEY_INPUT: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET_INPUT: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          MAKE_API_TOKEN_INPUT: ${{ secrets.MAKE_API_TOKEN }}
          MAKE_API_BASE_URL_INPUT: ${{ secrets.MAKE_API_BASE_URL }}
          MAKE_ORGANIZATION_ID_INPUT: ${{ secrets.MAKE_ORGANIZATION_ID }}
          MAKE_TEAM_ID_INPUT: ${{ secrets.MAKE_TEAM_ID }}
          MAKE_APPOINTMENT_WEBHOOK_URL_INPUT: ${{ secrets.MAKE_APPOINTMENT_WEBHOOK_URL }}
          MAKE_REMINDER_WEBHOOK_URL_INPUT: ${{ secrets.MAKE_REMINDER_WEBHOOK_URL }}
          MAKE_BILLING_WEBHOOK_URL_INPUT: ${{ secrets.MAKE_BILLING_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = (await import('node:fs')).default;

          const clean = (value) => (value || '').replace(/[\r\n]/g, '').trim();
          const projectId = clean(process.env.VERCEL_PROJECT_ID);
          const vercelTeamId = clean(process.env.VERCEL_ORG_ID);
          const vercelToken = clean(process.env.VERCEL_TOKEN);
          const stripeKey = clean(process.env.STRIPE_SECRET_KEY_INPUT);
          const existingStripeWebhookSecret = clean(process.env.STRIPE_WEBHOOK_SECRET_INPUT);
          const makeApiToken = clean(process.env.MAKE_API_TOKEN_INPUT);
          const makeApiBaseInput = clean(process.env.MAKE_API_BASE_URL_INPUT).replace(/\/$/, '');
          const makeOrganizationIdInput = clean(process.env.MAKE_ORGANIZATION_ID_INPUT);
          const makeTeamIdInput = clean(process.env.MAKE_TEAM_ID_INPUT);
          let makeAppointment = clean(process.env.MAKE_APPOINTMENT_WEBHOOK_URL_INPUT);
          const makeReminder = clean(process.env.MAKE_REMINDER_WEBHOOK_URL_INPUT);
          const makeBilling = clean(process.env.MAKE_BILLING_WEBHOOK_URL_INPUT);
          const summaryFile = process.env.GITHUB_STEP_SUMMARY;

          const canonicalAppUrl = 'https://agendafacil-staging-pearl.vercel.app';
          const stripeWebhookUrl = `${canonicalAppUrl}/api/stripe/webhook`;
          const expectedStripeAccount = 'acct_1U9otY7P2nwS1Www';
          const monthlyLookup = 'agendafacil_pro_monthly';
          const annualLookup = 'agendafacil_pro_annual';
          const makeHookName = 'AgendaFacil Staging';

          if (!projectId || !vercelTeamId || !vercelToken) {
            throw new Error('Vercel staging API credentials are unavailable.');
          }

          const status = {
            vercelAccess: true,
            stripeKeyPresent: Boolean(stripeKey),
            stripeKeyValidated: false,
            stripeCatalogValidated: false,
            stripePortalConfigured: false,
            stripeWebhookEndpoint: false,
            stripeWebhookSecretSynced: false,
            makeApiTokenPresent: Boolean(makeApiToken),
            makeApiConnected: false,
            makeHookPresent: false,
            makeAppointmentPresent: Boolean(makeAppointment),
            makeReminderEffective: Boolean(makeReminder || makeAppointment),
            makeBillingPresent: Boolean(makeBilling),
            vercelEnvUpdated: false,
          };

          async function requestJson(url, init = {}, label = 'request') {
            const response = await fetch(url, init);
            let data = null;
            try { data = await response.json(); } catch {}
            if (!response.ok) {
              throw new Error(`${label} failed with HTTP ${response.status}.`);
            }
            return data;
          }

          async function stripeRequest(path, init = {}) {
            return requestJson(
              `https://api.stripe.com${path}`,
              {
                ...init,
                headers: {
                  Authorization: `Bearer ${stripeKey}`,
                  ...(init.headers || {}),
                },
              },
              `Stripe TEST request for ${path}`,
            );
          }

          async function makeRequest(base, path, init = {}) {
            return requestJson(
              `${base}${path}`,
              {
                ...init,
                headers: {
                  Authorization: `Token ${makeApiToken}`,
                  Accept: 'application/json',
                  ...(init.headers || {}),
                },
              },
              `Make request for ${path}`,
            );
          }

          async function discoverMakeBase() {
            const candidates = [
              makeApiBaseInput,
              'https://eu1.make.com/api/v2',
              'https://eu2.make.com/api/v2',
              'https://us1.make.com/api/v2',
              'https://us2.make.com/api/v2',
            ].filter(Boolean);

            for (const base of [...new Set(candidates)]) {
              try {
                const response = await fetch(`${base}/organizations?pg%5Blimit%5D=100`, {
                  headers: {
                    Authorization: `Token ${makeApiToken}`,
                    Accept: 'application/json',
                  },
                });
                if (response.ok) {
                  const data = await response.json();
                  return { base, organizations: Array.isArray(data?.organizations) ? data.organizations : [] };
                }
              } catch {}
            }
            throw new Error('MAKE_API_TOKEN could not authenticate to a supported Make zone.');
          }

          const vercelEnvs = [];
          const addSensitiveEnv = (key, value) => {
            if (!value) return;
            vercelEnvs.push({
              key,
              value,
              type: 'sensitive',
              target: ['production'],
              comment: 'Synced by AgendaFacil staging integration bootstrap',
            });
          };

          // Stripe TEST bootstrap. Never accepts a live key.
          let stripeWebhookSecret = existingStripeWebhookSecret;
          if (stripeKey) {
            if (!(stripeKey.startsWith('sk_test_') || stripeKey.startsWith('rk_test_'))) {
              throw new Error('Refusing to use a Stripe key that is not explicitly TEST mode.');
            }

            // Standard test keys can verify the account directly. Restricted keys may not
            // include account-read permission, so the catalog below remains the authoritative
            // validation for them.
            if (stripeKey.startsWith('sk_test_')) {
              const account = await stripeRequest('/v1/account');
              if (account?.id !== expectedStripeAccount) {
                throw new Error('Stripe TEST key belongs to an unexpected account.');
              }
            }

            const priceParams = new URLSearchParams();
            priceParams.append('active', 'true');
            priceParams.append('limit', '10');
            priceParams.append('lookup_keys[]', monthlyLookup);
            priceParams.append('lookup_keys[]', annualLookup);
            const prices = await stripeRequest(`/v1/prices?${priceParams.toString()}`);
            const priceData = Array.isArray(prices?.data) ? prices.data : [];
            const lookups = new Set(priceData.map((price) => price.lookup_key));
            if (!lookups.has(monthlyLookup) || !lookups.has(annualLookup)) {
              throw new Error('Stripe TEST catalog is missing one or both required Pro lookup keys.');
            }
            if (priceData.some((price) => price.livemode !== false)) {
              throw new Error('Refusing to use a Stripe catalog that is not TEST mode.');
            }
            status.stripeKeyValidated = true;
            status.stripeCatalogValidated = true;

            // Configure Customer Portal if no active TEST configuration exists.
            const portalList = await stripeRequest('/v1/billing_portal/configurations?active=true&limit=100');
            let portalConfig = (Array.isArray(portalList?.data) ? portalList.data : [])
              .find((item) => item?.livemode === false);
            if (!portalConfig) {
              const form = new URLSearchParams();
              form.set('default_return_url', `${canonicalAppUrl}/dashboard/billing`);
              form.set('features[customer_update][enabled]', 'true');
              form.append('features[customer_update][allowed_updates][]', 'email');
              form.append('features[customer_update][allowed_updates][]', 'name');
              form.append('features[customer_update][allowed_updates][]', 'phone');
              form.set('features[invoice_history][enabled]', 'true');
              form.set('features[payment_method_update][enabled]', 'true');
              form.set('features[subscription_cancel][enabled]', 'true');
              form.set('features[subscription_cancel][mode]', 'at_period_end');
              form.set('features[subscription_cancel][cancellation_reason][enabled]', 'true');
              for (const reason of ['too_expensive', 'missing_features', 'unused', 'other']) {
                form.append('features[subscription_cancel][cancellation_reason][options][]', reason);
              }
              portalConfig = await stripeRequest('/v1/billing_portal/configurations', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: form.toString(),
              });
            }
            if (!portalConfig?.id || portalConfig?.livemode !== false) {
              throw new Error('Stripe TEST Customer Portal configuration could not be validated.');
            }
            status.stripePortalConfigured = true;

            const endpointList = await stripeRequest('/v1/webhook_endpoints?limit=100');
            const endpoints = Array.isArray(endpointList?.data) ? endpointList.data : [];
            let matching = endpoints.filter((item) => item.url === stripeWebhookUrl && item.status !== 'disabled');
            let endpoint = matching[0] || null;

            // A webhook signing secret is only returned at creation time. If an endpoint
            // already exists but the secret is unavailable, disable all matching orphaned
            // TEST endpoints and recreate one so the signing secret can be captured safely.
            if (endpoint && !stripeWebhookSecret) {
              for (const orphan of matching) {
                const disable = new URLSearchParams();
                disable.set('disabled', 'true');
                await stripeRequest(`/v1/webhook_endpoints/${encodeURIComponent(orphan.id)}`, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                  body: disable.toString(),
                });
              }
              endpoint = null;
            }

            if (!endpoint) {
              const form = new URLSearchParams();
              form.set('url', stripeWebhookUrl);
              form.set('description', 'AgendaFacil staging Stripe TEST webhook');
              for (const event of [
                'checkout.session.completed',
                'customer.subscription.created',
                'customer.subscription.updated',
                'customer.subscription.deleted',
                'invoice.payment_succeeded',
                'invoice.paid',
                'invoice.payment_failed',
              ]) {
                form.append('enabled_events[]', event);
              }
              endpoint = await stripeRequest('/v1/webhook_endpoints', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: form.toString(),
              });
              stripeWebhookSecret = clean(endpoint?.secret);
              if (!stripeWebhookSecret) {
                throw new Error('Stripe TEST webhook was created but its signing secret was not returned.');
              }
            }

            status.stripeWebhookEndpoint = Boolean(endpoint?.id && endpoint?.livemode === false);
            addSensitiveEnv('STRIPE_SECRET_KEY', stripeKey);
            if (stripeWebhookSecret) {
              addSensitiveEnv('STRIPE_WEBHOOK_SECRET', stripeWebhookSecret);
              status.stripeWebhookSecretSynced = true;
            }
          } else {
            console.log('STRIPE_SECRET_KEY is not stored in GitHub secrets; Stripe runtime configuration was not changed.');
          }

          // Make bootstrap. If a direct appointment webhook URL is already stored, preserve it.
          // Otherwise, a Make API token can create/discover a staging gateway webhook safely.
          if (!makeAppointment && makeApiToken) {
            const discovered = await discoverMakeBase();
            status.makeApiConnected = true;

            const organizations = discovered.organizations;
            let organizationId = makeOrganizationIdInput;
            if (!organizationId) {
              if (organizations.length !== 1) {
                throw new Error('Make organization is ambiguous; store MAKE_ORGANIZATION_ID as a GitHub secret.');
              }
              organizationId = String(organizations[0].id);
            }

            const teamsData = await makeRequest(
              discovered.base,
              `/teams?organizationId=${encodeURIComponent(organizationId)}&pg%5Blimit%5D=100`,
            );
            const teams = Array.isArray(teamsData?.teams) ? teamsData.teams : [];
            let makeTeamId = makeTeamIdInput;
            if (!makeTeamId) {
              if (teams.length !== 1) {
                throw new Error('Make team is ambiguous; store MAKE_TEAM_ID as a GitHub secret.');
              }
              makeTeamId = String(teams[0].id);
            }

            const hooksData = await makeRequest(
              discovered.base,
              `/hooks?teamId=${encodeURIComponent(makeTeamId)}&typeName=gateway-webhook&pg%5Blimit%5D=100`,
            );
            const hooks = Array.isArray(hooksData?.hooks) ? hooksData.hooks : [];
            let hook = hooks.find((item) => item?.name === makeHookName && item?.enabled !== false) || null;

            if (!hook) {
              const created = await makeRequest(discovered.base, '/hooks', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  name: makeHookName,
                  teamId: String(makeTeamId),
                  typeName: 'gateway-webhook',
                  method: false,
                  headers: false,
                  stringify: false,
                }),
              });
              hook = typeof created?.hook === 'object' ? created.hook : null;
              const hookId = hook?.id || created?.hook;
              if ((!hook || !hook.url) && hookId) {
                const details = await makeRequest(discovered.base, `/hooks/${encodeURIComponent(hookId)}`);
                hook = details?.hook || details;
              }
            }

            if (!hook?.url || !String(hook.url).startsWith('https://')) {
              throw new Error('Make staging webhook was created/discovered without a valid HTTPS URL.');
            }
            makeAppointment = clean(hook.url);
            status.makeHookPresent = true;
          } else if (makeAppointment) {
            status.makeHookPresent = true;
          }

          status.makeAppointmentPresent = Boolean(makeAppointment);
          status.makeReminderEffective = Boolean(makeReminder || makeAppointment);

          addSensitiveEnv('MAKE_APPOINTMENT_WEBHOOK_URL', makeAppointment);
          addSensitiveEnv('MAKE_REMINDER_WEBHOOK_URL', makeReminder);
          addSensitiveEnv('MAKE_BILLING_WEBHOOK_URL', makeBilling);

          if (vercelEnvs.length) {
            const endpoint = new URL(`https://api.vercel.com/v10/projects/${encodeURIComponent(projectId)}/env`);
            endpoint.searchParams.set('upsert', 'true');
            endpoint.searchParams.set('teamId', vercelTeamId);
            const response = await fetch(endpoint, {
              method: 'POST',
              headers: {
                Authorization: `Bearer ${vercelToken}`,
                'Content-Type': 'application/json',
              },
              body: JSON.stringify(vercelEnvs),
            });
            let result = null;
            try { result = await response.json(); } catch {}
            if (!response.ok) {
              throw new Error(`Vercel integration environment upsert failed with HTTP ${response.status}.`);
            }
            const failed = Array.isArray(result?.failed) ? result.failed : [];
            if (failed.length) {
              const keys = failed.map((item) => item?.key || 'unknown').join(', ');
              throw new Error(`Vercel rejected integration environment variables: ${keys}`);
            }
            status.vercelEnvUpdated = true;
          } else {
            console.log('No integration secrets are currently available for Vercel sync.');
          }

          const mark = (value) => value ? '✅' : '⬜';
          const lines = [
            '## AgendaFácil staging integration bootstrap',
            '',
            `- ${mark(status.vercelAccess)} Vercel API access`,
            `- ${mark(status.stripeKeyPresent)} Stripe TEST key stored in GitHub`,
            `- ${mark(status.stripeKeyValidated)} Stripe TEST key/catalog validated`,
            `- ${mark(status.stripePortalConfigured)} Stripe TEST Customer Portal configured`,
            `- ${mark(status.stripeWebhookEndpoint)} Stripe TEST webhook endpoint present`,
            `- ${mark(status.stripeWebhookSecretSynced)} Stripe webhook signing secret available for Vercel sync`,
            `- ${mark(status.makeApiTokenPresent)} Make API token stored in GitHub`,
            `- ${mark(status.makeApiConnected)} Make API authenticated`,
            `- ${mark(status.makeHookPresent)} Make staging webhook present`,
            `- ${mark(status.makeAppointmentPresent)} Make appointment webhook available`,
            `- ${mark(status.makeReminderEffective)} Make reminder effective (specific or appointment fallback)`,
            `- ${mark(status.makeBillingPresent)} Make billing webhook stored (optional)`,
            `- ${mark(status.vercelEnvUpdated)} Integration environment updated in Vercel`,
            '',
            '> No secret values are printed by this workflow.',
          ];
          if (summaryFile) fs.appendFileSync(summaryFile, `${lines.join('\n')}\n`);
          console.log('Integration bootstrap completed without exposing secret values.');
          NODE

      - name: 🚀 Redeploy staging with synchronized environment
        working-directory: ./web
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@latest deploy --prod --yes --token="${{ secrets.VERCEL_TOKEN }}"

      - name: 🔎 Probe integration readiness after redeploy
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          STAGING_URL: https://agendafacil-staging-pearl.vercel.app
        run: |
          set -euo pipefail
          clean_cron_secret="$(printf '%s' "$CRON_SECRET" | tr -d '\r\n')"
          if [ -z "$clean_cron_secret" ]; then
            echo 'CRON_SECRET unavailable; readiness probe skipped.'
            exit 0
          fi
          for attempt in 1 2 3 4 5 6; do
            http_status=$(curl --silent --show-error --output /tmp/readiness.json --write-out "%{http_code}" \
              -H "Authorization: Bearer ${clean_cron_secret}" \
              "${STAGING_URL}/api/health/integrations" || true)
            if [ "$http_status" = "200" ]; then break; fi
            sleep 10
          done
          if [ "$http_status" != "200" ]; then
            echo "Readiness probe returned HTTP ${http_status}."
            exit 1
          fi
          node <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('/tmp/readiness.json', 'utf8'));
          console.log(JSON.stringify({
            appUrl: Boolean(data.appUrl),
            make: {
              appointment: Boolean(data.make?.appointment),
              reminderEffective: Boolean(data.make?.reminderEffective),
              billing: Boolean(data.make?.billing),
            },
            stripe: {
              secret: Boolean(data.stripe?.secret),
              webhook: Boolean(data.stripe?.webhook),
              proMonthly: Boolean(data.stripe?.proMonthly),
              proAnnual: Boolean(data.stripe?.proAnnual),
              studioMonthly: Boolean(data.stripe?.studioMonthly),
            },
          }, null, 2));
          NODE
