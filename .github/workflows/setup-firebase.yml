name: Setup Firebase Firestore

on:
  workflow_dispatch:

jobs:
  setup-firebase:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install firebase-admin

      - name: Save Service Account Key
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$SERVICE_ACCOUNT_JSON" > agendafacil-pro-firebase-adminsdk-fbsvc-26027d73d1.json
          echo "✅ Service account key saved"

      - name: Setup Firebase
        run: |
          python setup_firebase.py
