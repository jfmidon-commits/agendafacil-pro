name: Setup Firebase Firestore v2.0

on:
  workflow_dispatch:

jobs:
  setup-firebase:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install firebase-admin

      - name: Save Service Account Key
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$SERVICE_ACCOUNT_JSON" > agendafacil-pro-firebase-adminsdk-fbsvc-26027d73d1.json
          echo "✅ Service account key saved"

      - name: Setup Firebase v2.0
        run: |
          python setup_firebase.py

      - name: Verify setup
        run: |
          echo "✅ Firebase v2.0 setup completed!"
          echo "Coleções criadas:"
          echo "  - users (dados privados)"
          echo "  - publicProfiles (dados públicos)"
          echo "  - services"
          echo "  - availabilityRules"
          echo "  - scheduleBlocks"
          echo "  - appointments (v2.0 com startsAt/endsAt)"
          echo "  - subscriptions"
